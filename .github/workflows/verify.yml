name: Verify Site Changes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Build and regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install pyyaml jinja2

      - name: Run regression suite
        run: python -m unittest discover -s tests -v

      - name: Verify production artifact
        run: python -m scripts.build
