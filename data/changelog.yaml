schema_version: "1.0.0"
dataset: "public_changelog"
status: "active"
owner: "TourVsTravel"

meta:
  purpose: "Public, append-only record of substantive changes to the TourVsTravel reference system."
  operating_principle: "Entries are never edited or removed. Corrections are new entries referencing the superseded one. Mirrors DECISIONS.md."
  source_of_truth: true

entries:
  - id: "2026-07-03-plan-adoption"
    date: "2026-07-03"
    decision_ref: "D-001"
    title:
      en: "Category Intelligence Factory plan adopted"
      ar: "اعتماد خطة مصنع ذكاء الفئة"
      fr: "Adoption du plan Category Intelligence Factory"
      es: "Adopción del plan Category Intelligence Factory"
      de: "Category-Intelligence-Factory-Plan verabschiedet"
      zh: "通过类别智能工厂发展计划"
      ja: "カテゴリー・インテリジェンス・ファクトリー計画を採択"
    summary:
      en: "The governing development plan was adopted. The asset's target state is a governed reference system for Travel Decision Architecture: a named ontology, a named standard, an operating protocol, machine-readable endpoints, and a public governance record."
      ar: "اعتُمدت خطة التطوير الحاكمة. الحالة المستهدفة للأصل هي نظام مرجعي محكوم لبنية قرار السفر: أنطولوجيا مسماة، ومعيار مسمى، وبروتوكول تشغيلي، ونقاط وصول مقروءة آليًا، وسجل حوكمة علني."
      fr: "Le plan de développement directeur a été adopté. L'état cible de l'actif est un système de référence gouverné pour l'architecture de décision de voyage : une ontologie nommée, un standard nommé, un protocole opérationnel, des points d'accès lisibles par machine et un registre de gouvernance public."
      es: "Se adoptó el plan de desarrollo rector. El estado objetivo del activo es un sistema de referencia gobernado para la arquitectura de decisión de viaje: una ontología con nombre, un estándar con nombre, un protocolo operativo, puntos de acceso legibles por máquina y un registro público de gobernanza."
      de: "Der leitende Entwicklungsplan wurde verabschiedet. Zielzustand des Assets ist ein regelgeleitetes Referenzsystem für Reiseentscheidungsarchitektur: eine benannte Ontologie, ein benannter Standard, ein operatives Protokoll, maschinenlesbare Endpunkte und ein öffentliches Governance-Register."
      zh: "通过了指导性发展计划。该资产的目标状态是一个受治理的旅行决策架构参考系统：命名的本体、命名的标准、可操作的协议、机器可读端点以及公开的治理记录。"
      ja: "統治的な開発計画が採択された。本資産の目標状態は、旅行意思決定アーキテクチャのための統治されたリファレンスシステムである：命名されたオントロジー、命名された基準、運用プロトコル、機械可読エンドポイント、公開ガバナンス記録。"

  - id: "2026-07-03-claims-restraint"
    date: "2026-07-03"
    decision_ref: "D-002"
    title:
      en: "Unverifiable destination-count claim retired"
      ar: "سحب ادعاء عدد الوجهات غير القابل للإثبات"
      fr: "Retrait de l'affirmation invérifiable sur le nombre de destinations"
      es: "Retirada de la afirmación no verificable sobre el número de destinos"
      de: "Nicht belegbare Reiseziel-Zahlenangabe zurückgezogen"
      zh: "撤回无法证实的目的地数量表述"
      ja: "検証不能な目的地数の表記を撤回"
    summary:
      en: "A destination-count figure was removed from public copy in all seven languages because no published destination pages backed it. Public numbers now use only build-verified counts, and a claims-restraint gate fails the build if a retired claim reappears."
      ar: "أُزيل رقم عدد الوجهات من النصوص العامة في اللغات السبع لأنه لم تكن هناك صفحات وجهات منشورة تدعمه. الأرقام العامة تستخدم الآن أعدادًا يتحقق منها البناء فقط، وتُفشل بوابة ضبط الادعاءات البناء إذا عاد أي ادعاء مسحوب."
      fr: "Un chiffre de destinations a été retiré des textes publics dans les sept langues, car aucune page de destination publiée ne l'étayait. Les nombres publics n'utilisent désormais que des comptages vérifiés par le build, et une barrière de retenue des affirmations fait échouer le build si une affirmation retirée réapparaît."
      es: "Se eliminó una cifra de destinos de los textos públicos en los siete idiomas porque ninguna página de destino publicada la respaldaba. Los números públicos ahora usan solo recuentos verificados por el build, y una barrera de contención de afirmaciones hace fallar el build si reaparece una afirmación retirada."
      de: "Eine Reiseziel-Zahl wurde in allen sieben Sprachen aus den öffentlichen Texten entfernt, da keine veröffentlichten Zielseiten sie belegten. Öffentliche Zahlen verwenden nur noch build-verifizierte Werte, und ein Claims-Restraint-Gate lässt den Build fehlschlagen, falls eine zurückgezogene Angabe wieder auftaucht."
      zh: "由于没有已发布的目的地页面作为依据，公开文案中的目的地数量已在七种语言中全部移除。公开数字现在仅使用经构建验证的计数，若已撤回的表述再次出现，声明约束关卡将使构建失败。"
      ja: "公開済みの目的地ページによる裏付けがなかったため、7言語すべての公開文面から目的地数の数値を削除した。公開される数値はビルドで検証された数のみを使用し、撤回済みの表記が再出現した場合はクレーム抑制ゲートがビルドを失敗させる。"

  - id: "2026-07-03-governance-layer"
    date: "2026-07-03"
    decision_ref: "D-003"
    title:
      en: "Public governance layer established"
      ar: "تأسيس طبقة الحوكمة العلنية"
      fr: "Mise en place de la couche de gouvernance publique"
      es: "Establecimiento de la capa pública de gobernanza"
      de: "Öffentliche Governance-Ebene eingerichtet"
      zh: "建立公开治理层"
      ja: "公開ガバナンス層を確立"
    summary:
      en: "Standing rules (GOVERNANCE.md) and an append-only decision log (DECISIONS.md) were added to the repository. Substantive changes to the ontology, standard, public claims, routes, or monetization now require a logged decision."
      ar: "أُضيفت القواعد الدائمة (GOVERNANCE.md) وسجل قرارات لا يقبل إلا الإضافة (DECISIONS.md) إلى المستودع. التغييرات الجوهرية في الأنطولوجيا أو المعيار أو الادعاءات العامة أو المسارات أو التسييل تتطلب الآن قرارًا مسجلًا."
      fr: "Des règles permanentes (GOVERNANCE.md) et un journal de décisions en ajout seul (DECISIONS.md) ont été ajoutés au dépôt. Les changements substantiels de l'ontologie, du standard, des affirmations publiques, des routes ou de la monétisation exigent désormais une décision consignée."
      es: "Se añadieron al repositorio reglas permanentes (GOVERNANCE.md) y un registro de decisiones de solo adición (DECISIONS.md). Los cambios sustanciales en la ontología, el estándar, las afirmaciones públicas, las rutas o la monetización requieren ahora una decisión registrada."
      de: "Ständige Regeln (GOVERNANCE.md) und ein Append-only-Entscheidungsprotokoll (DECISIONS.md) wurden dem Repository hinzugefügt. Wesentliche Änderungen an Ontologie, Standard, öffentlichen Aussagen, Routen oder Monetarisierung erfordern nun eine protokollierte Entscheidung."
      zh: "仓库中新增了常设规则（GOVERNANCE.md）和只增不改的决策日志（DECISIONS.md）。对本体、标准、公开表述、路由或变现机制的实质性更改现在都需要记录在案的决策。"
      ja: "常設ルール（GOVERNANCE.md）と追記専用の意思決定ログ（DECISIONS.md）をリポジトリに追加した。オントロジー、基準、公開表記、ルート、収益化に関する実質的な変更には、記録された決定が必要となった。"

  - id: "2026-07-03-category-infrastructure"
    date: "2026-07-03"
    decision_ref: "D-004"
    title:
      en: "TSO v1, TDIS v1, and the machine layer published"
      ar: "نشر TSO v1 وTDIS v1 وطبقة الآلة"
      fr: "Publication de TSO v1, TDIS v1 et de la couche machine"
      es: "Publicación de TSO v1, TDIS v1 y la capa máquina"
      de: "TSO v1, TDIS v1 und die Maschinenebene veröffentlicht"
      zh: "发布 TSO v1、TDIS v1 与机器层"
      ja: "TSO v1、TDIS v1、マシンレイヤーを公開"
    summary:
      en: "The Travel Structure Ontology (TSO) v1 and the Travel Decision Integrity Standard (TDIS) v1, including the Structure Fit Protocol, received canonical public pages in seven languages. Versioned machine-readable endpoints were published so AI agents can read the same definitions humans read."
      ar: "حصلت أنطولوجيا بنى السفر (TSO) الإصدار الأول ومعيار سلامة قرار السفر (TDIS) الإصدار الأول، بما فيه بروتوكول ملاءمة البنية، على صفحات علنية قانونية بسبع لغات. ونُشرت نقاط وصول مقروءة آليًا ومُصدَّرة حتى يقرأ وكلاء AI التعريفات نفسها التي يقرؤها البشر."
      fr: "La Travel Structure Ontology (TSO) v1 et le Travel Decision Integrity Standard (TDIS) v1, incluant le Structure Fit Protocol, ont reçu des pages publiques canoniques en sept langues. Des points d'accès versionnés lisibles par machine ont été publiés afin que les agents IA lisent les mêmes définitions que les humains."
      es: "La Travel Structure Ontology (TSO) v1 y el Travel Decision Integrity Standard (TDIS) v1, incluido el Structure Fit Protocol, recibieron páginas públicas canónicas en siete idiomas. Se publicaron puntos de acceso versionados legibles por máquina para que los agentes de IA lean las mismas definiciones que leen las personas."
      de: "Die Travel Structure Ontology (TSO) v1 und der Travel Decision Integrity Standard (TDIS) v1, einschließlich des Structure Fit Protocol, erhielten kanonische öffentliche Seiten in sieben Sprachen. Versionierte maschinenlesbare Endpunkte wurden veröffentlicht, damit KI-Agenten dieselben Definitionen lesen wie Menschen."
      zh: "旅行结构本体（TSO）v1 与旅行决策完整性标准（TDIS）v1（含结构适配协议）以七种语言获得了规范的公开页面。同时发布了带版本的机器可读端点，使 AI 代理能够读取与人类相同的定义。"
      ja: "旅行構造オントロジー（TSO）v1 と旅行意思決定インテグリティ基準（TDIS）v1（構造適合プロトコルを含む）が、7言語の正規公開ページを得た。AIエージェントが人間と同じ定義を読めるよう、バージョン管理された機械可読エンドポイントも公開された。"

  - id: "2026-07-03-artifact-discipline"
    date: "2026-07-03"
    decision_ref: "D-005"
    title:
      en: "Build artifacts removed from version control"
      ar: "إخراج نواتج البناء من تتبع الإصدارات"
      fr: "Artefacts de build retirés du contrôle de version"
      es: "Artefactos de build retirados del control de versiones"
      de: "Build-Artefakte aus der Versionskontrolle entfernt"
      zh: "构建产物移出版本控制"
      ja: "ビルド成果物をバージョン管理から除外"
    summary:
      en: "The generated output directory is no longer tracked in the repository. The deploy pipeline has always rebuilt the site from source and is now the sole producer of build artifacts. This enforces input/output discipline: governed sources in, derived artifacts out, and no phantom merge conflicts between build timestamps."
      ar: "لم يعد مجلد الإخراج المولَّد مُتتبَّعًا في المستودع. خط النشر كان يعيد بناء الموقع من المصدر دائمًا، وهو الآن المنتج الوحيد لنواتج البناء. هذا يفرض انضباط الإدخال والإخراج: مصادر محكومة تدخل، ونواتج مشتقة تخرج، وبلا تعارضات دمج وهمية بين طوابع البناء."
      fr: "Le répertoire de sortie généré n'est plus suivi dans le dépôt. Le pipeline de déploiement a toujours reconstruit le site depuis la source et il est désormais l'unique producteur des artefacts de build. Cela impose la discipline entrée/sortie : des sources gouvernées en entrée, des artefacts dérivés en sortie, et aucun conflit de fusion fantôme entre horodatages de build."
      es: "El directorio de salida generado ya no se rastrea en el repositorio. El pipeline de despliegue siempre ha reconstruido el sitio desde la fuente y ahora es el único productor de artefactos de build. Esto impone la disciplina de entrada/salida: fuentes gobernadas entran, artefactos derivados salen, y sin conflictos de fusión fantasma entre marcas de tiempo de build."
      de: "Das generierte Ausgabeverzeichnis wird nicht mehr im Repository verfolgt. Die Deploy-Pipeline hat die Website schon immer aus den Quellen neu gebaut und ist nun der einzige Produzent der Build-Artefakte. Das erzwingt Eingabe-/Ausgabe-Disziplin: regelgeleitete Quellen hinein, abgeleitete Artefakte hinaus, und keine Phantom-Merge-Konflikte zwischen Build-Zeitstempeln mehr."
      zh: "生成的输出目录不再纳入仓库跟踪。部署流水线一直都是从源码重建站点，现在它是构建产物的唯一生产者。这强化了输入/输出纪律：受治理的源进入，派生的产物输出，构建时间戳之间不再出现幻影合并冲突。"
      ja: "生成された出力ディレクトリはリポジトリで追跡されなくなった。デプロイパイプラインは常にソースからサイトを再構築しており、今後はビルド成果物の唯一の生成者となる。これにより入出力の規律が強制される：統治されたソースが入り、派生成果物が出る。ビルドタイムスタンプ間の幻のマージ競合はもう発生しない。"

  - id: "2026-07-04-compass-v1"
    date: "2026-07-04"
    decision_ref: "D-006"
    title:
      en: "Travel Decision Compass v1 launched"
      ar: "إطلاق بوصلة قرار السفر — الإصدار الأول"
      fr: "Lancement de la Boussole de Décision de Voyage v1"
      es: "Lanzamiento de la Brújula de Decisión de Viaje v1"
      de: "Reise-Entscheidungskompass v1 gestartet"
      zh: "旅行决策指南针 v1 上线"
      ja: "トラベル・ディシジョン・コンパス v1 を公開"
    summary:
      en: "The first operating implementation of the Structure Fit Protocol went live in seven languages. Seven questions produce a ranked structure-fit diagnosis across all seventeen ontology structures, with fit bands, explicit tradeoffs, and citations — fully in the browser, with no tracking. Destination context is the v2 contract and activates when the governed destinations dataset ships."
      ar: "أُطلق أول تنفيذ تشغيلي لبروتوكول ملاءمة البنية بسبع لغات. سبعة أسئلة تنتج تشخيص ملاءمة مرتبًا عبر بنى الأنطولوجيا السبع عشرة كلها، مع نطاقات ملاءمة ومفاضلات صريحة واستشهادات — بالكامل في المتصفح وبلا تتبع. سياق الوجهة هو عقد الإصدار الثاني ويُفعَّل عند نشر مجموعة بيانات الوجهات المحكومة."
      fr: "La première implémentation opérationnelle du Structure Fit Protocol est en ligne en sept langues. Sept questions produisent un diagnostic d'adéquation classé sur les dix-sept structures de l'ontologie, avec bandes d'adéquation, compromis explicites et citations — entièrement dans le navigateur, sans traçage. Le contexte de destination est le contrat v2 et s'activera à la publication du jeu de données de destinations gouverné."
      es: "La primera implementación operativa del Structure Fit Protocol entró en funcionamiento en siete idiomas. Siete preguntas producen un diagnóstico de ajuste ordenado sobre las diecisiete estructuras de la ontología, con bandas de ajuste, contrapartidas explícitas y citas: todo en el navegador y sin rastreo. El contexto de destino es el contrato v2 y se activará cuando se publique el conjunto de datos de destinos gobernado."
      de: "Die erste operative Implementierung des Structure Fit Protocol ging in sieben Sprachen live. Sieben Fragen erzeugen eine geordnete Passungsdiagnose über alle siebzehn Ontologie-Strukturen, mit Passungsbändern, expliziten Zielkonflikten und Zitationen — vollständig im Browser, ohne Tracking. Der Zielkontext ist der v2-Vertrag und wird mit dem regelgeleiteten Reiseziel-Datensatz aktiviert."
      zh: "结构适配协议的首个运行实现已以七种语言上线。七个问题即可在全部十七种本体结构上生成排序的适配诊断，包含适配区间、明确取舍与引用——完全在浏览器中运行，无任何跟踪。目的地情境是 v2 契约，将在受治理的目的地数据集发布后启用。"
      ja: "構造適合プロトコルの最初の運用実装が7言語で公開された。7つの質問から、17のオントロジー構造すべてにわたる順位付き適合診断が生成される。適合バンド、明示的なトレードオフ、引用付きで、すべてブラウザ内で動作し、トラッキングは一切ない。目的地の文脈は v2 契約であり、統治された目的地データセットの公開時に有効化される。"

  - id: "2026-07-04-buyer-truth-localization"
    date: "2026-07-04"
    decision_ref: "D-007"
    title:
      en: "Acquisition page updated to current infrastructure; tools index fully localized"
      ar: "تحديث صفحة الاستحواذ إلى البنية الحالية؛ وتعريب فهرس الأدوات بالكامل"
      fr: "Page d'acquisition mise à jour vers l'infrastructure actuelle ; index des outils entièrement localisé"
      es: "Página de adquisición actualizada a la infraestructura actual; índice de herramientas totalmente localizado"
      de: "Akquisitionsseite auf die aktuelle Infrastruktur aktualisiert; Werkzeug-Index vollständig lokalisiert"
      zh: "收购页面更新为当前基础设施；工具索引完成全面本地化"
      ja: "取得ページを現行インフラに更新、ツール索引を完全ローカライズ"
    summary:
      en: "The acquisition page now describes the asset as it verifiably is — TSO v1, TDIS v1 with the Structure Fit Protocol, the Compass engine, the machine layer, and the public governance record — in all seven languages. The tools index dropped its English fallback: cards and system steps are now localized in every language."
      ar: "تصف صفحة الاستحواذ الآن الأصل كما هو مثبت فعلًا — TSO v1 وTDIS v1 مع بروتوكول ملاءمة البنية ومحرك البوصلة وطبقة الآلة وسجل الحوكمة العلني — باللغات السبع كلها. وتخلص فهرس الأدوات من سقوطه إلى الإنجليزية: البطاقات وخطوات النظام مترجمة الآن في كل لغة."
      fr: "La page d'acquisition décrit désormais l'actif tel qu'il est vérifiable — TSO v1, TDIS v1 avec le Structure Fit Protocol, le moteur Boussole, la couche machine et le registre de gouvernance public — dans les sept langues. L'index des outils a abandonné son repli vers l'anglais : cartes et étapes système sont désormais localisées dans chaque langue."
      es: "La página de adquisición describe ahora el activo tal como es verificable — TSO v1, TDIS v1 con el Structure Fit Protocol, el motor Brújula, la capa máquina y el registro público de gobernanza — en los siete idiomas. El índice de herramientas abandonó su respaldo en inglés: las tarjetas y los pasos del sistema están ahora localizados en cada idioma."
      de: "Die Akquisitionsseite beschreibt das Asset nun so, wie es nachprüfbar ist — TSO v1, TDIS v1 mit dem Structure Fit Protocol, die Kompass-Engine, die Maschinenebene und das öffentliche Governance-Register — in allen sieben Sprachen. Der Werkzeug-Index hat seinen englischen Fallback aufgegeben: Karten und Systemschritte sind jetzt in jeder Sprache lokalisiert."
      zh: "收购页面现在以七种语言如实描述该资产的可验证现状——TSO v1、含结构适配协议的 TDIS v1、指南针引擎、机器层与公开治理记录。工具索引不再回退到英文：卡片与系统步骤现已在每种语言中本地化。"
      ja: "取得ページは、TSO v1、構造適合プロトコルを含む TDIS v1、コンパスエンジン、マシンレイヤー、公開ガバナンス記録という検証可能な現状を、7言語すべてで記述するようになった。ツール索引は英語フォールバックを廃止し、カードとシステムステップは全言語でローカライズされた。"

  - id: "2026-07-04-destinations-batch-1"
    date: "2026-07-04"
    decision_ref: "D-008"
    title:
      en: "Destinations governed batch 1 published"
      ar: "نشر الدفعة المحكومة الأولى من الوجهات"
      fr: "Publication du premier lot gouverné de destinations"
      es: "Publicación del primer lote gobernado de destinos"
      de: "Erste regelgeleitete Reiseziel-Charge veröffentlicht"
      zh: "发布第一批受治理目的地"
      ja: "統治された目的地バッチ1を公開"
    summary:
      en: "Ten destinations joined the reference system, each interpreted through travel structures rather than attractions: seven-language coverage, family-fit structural priors mapped to the ontology, official tourism-body sources, and a build gate that forbids missing or phantom destination pages."
      ar: "انضمت عشر وجهات إلى النظام المرجعي، كل منها مقروءة عبر بنى السفر لا عبر المعالم: تغطية بسبع لغات، وافتراضات بنيوية لملاءمة العائلات مربوطة بالأنطولوجيا، ومصادر هيئات سياحة رسمية، وبوابة بناء تمنع الصفحات الناقصة أو الوهمية."
      fr: "Dix destinations ont rejoint le système de référence, chacune interprétée à travers les structures de voyage plutôt que les attractions : couverture en sept langues, a priori structurels d'adéquation par famille reliés à l'ontologie, sources officielles des organismes de tourisme, et une barrière de build interdisant les pages manquantes ou fantômes."
      es: "Diez destinos se incorporaron al sistema de referencia, cada uno interpretado a través de estructuras de viaje y no de atracciones: cobertura en siete idiomas, priores estructurales de ajuste por familia vinculados a la ontología, fuentes oficiales de organismos de turismo y una barrera de build que prohíbe páginas faltantes o fantasma."
      de: "Zehn Reiseziele traten dem Referenzsystem bei, jedes durch Reisestrukturen statt Attraktionen interpretiert: Abdeckung in sieben Sprachen, strukturelle Familien-Passungsprioren mit Ontologie-Anbindung, offizielle Tourismus-Quellen und ein Build-Gate, das fehlende oder Phantom-Seiten verbietet."
      zh: "十个目的地加入参考系统，每个都通过旅行结构而非景点来解读：七种语言覆盖、与本体关联的家族适配结构性先验、官方旅游机构来源，以及禁止缺失或幻影页面的构建关卡。"
      ja: "10の目的地がリファレンスシステムに加わった。それぞれ観光名所ではなく旅行構造で解読されている。7言語のカバレッジ、オントロジーに紐づくファミリー適合の構造的事前値、公式観光機関のソース、そして欠落ページや幻のページを禁じるビルドゲートを備える。"
