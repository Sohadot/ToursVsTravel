schema_version: "1.0.0"
dataset: "public_changelog"
status: "active"
owner: "TourVsTravel"

meta:
  purpose: "Public, append-only record of substantive changes to the TourVsTravel reference system."
  operating_principle: "Entries are never edited or removed. Corrections are new entries referencing the superseded one. Mirrors DECISIONS.md."
  source_of_truth: true

entries:
  - id: "2026-07-03-plan-adoption"
    date: "2026-07-03"
    decision_ref: "D-001"
    title:
      en: "Category Intelligence Factory plan adopted"
      ar: "اعتماد خطة مصنع ذكاء الفئة"
      fr: "Adoption du plan Category Intelligence Factory"
      es: "Adopción del plan Category Intelligence Factory"
      de: "Category-Intelligence-Factory-Plan verabschiedet"
      zh: "通过类别智能工厂发展计划"
      ja: "カテゴリー・インテリジェンス・ファクトリー計画を採択"
    summary:
      en: "The governing development plan was adopted. The asset's target state is a governed reference system for Travel Decision Architecture: a named ontology, a named standard, an operating protocol, machine-readable endpoints, and a public governance record."
      ar: "اعتُمدت خطة التطوير الحاكمة. الحالة المستهدفة للأصل هي نظام مرجعي محكوم لبنية قرار السفر: أنطولوجيا مسماة، ومعيار مسمى، وبروتوكول تشغيلي، ونقاط وصول مقروءة آليًا، وسجل حوكمة علني."
      fr: "Le plan de développement directeur a été adopté. L'état cible de l'actif est un système de référence gouverné pour l'architecture de décision de voyage : une ontologie nommée, un standard nommé, un protocole opérationnel, des points d'accès lisibles par machine et un registre de gouvernance public."
      es: "Se adoptó el plan de desarrollo rector. El estado objetivo del activo es un sistema de referencia gobernado para la arquitectura de decisión de viaje: una ontología con nombre, un estándar con nombre, un protocolo operativo, puntos de acceso legibles por máquina y un registro público de gobernanza."
      de: "Der leitende Entwicklungsplan wurde verabschiedet. Zielzustand des Assets ist ein regelgeleitetes Referenzsystem für Reiseentscheidungsarchitektur: eine benannte Ontologie, ein benannter Standard, ein operatives Protokoll, maschinenlesbare Endpunkte und ein öffentliches Governance-Register."
      zh: "通过了指导性发展计划。该资产的目标状态是一个受治理的旅行决策架构参考系统：命名的本体、命名的标准、可操作的协议、机器可读端点以及公开的治理记录。"
      ja: "統治的な開発計画が採択された。本資産の目標状態は、旅行意思決定アーキテクチャのための統治されたリファレンスシステムである：命名されたオントロジー、命名された基準、運用プロトコル、機械可読エンドポイント、公開ガバナンス記録。"

  - id: "2026-07-03-claims-restraint"
    date: "2026-07-03"
    decision_ref: "D-002"
    title:
      en: "Unverifiable destination-count claim retired"
      ar: "سحب ادعاء عدد الوجهات غير القابل للإثبات"
      fr: "Retrait de l'affirmation invérifiable sur le nombre de destinations"
      es: "Retirada de la afirmación no verificable sobre el número de destinos"
      de: "Nicht belegbare Reiseziel-Zahlenangabe zurückgezogen"
      zh: "撤回无法证实的目的地数量表述"
      ja: "検証不能な目的地数の表記を撤回"
    summary:
      en: "A destination-count figure was removed from public copy in all seven languages because no published destination pages backed it. Public numbers now use only build-verified counts, and a claims-restraint gate fails the build if a retired claim reappears."
      ar: "أُزيل رقم عدد الوجهات من النصوص العامة في اللغات السبع لأنه لم تكن هناك صفحات وجهات منشورة تدعمه. الأرقام العامة تستخدم الآن أعدادًا يتحقق منها البناء فقط، وتُفشل بوابة ضبط الادعاءات البناء إذا عاد أي ادعاء مسحوب."
      fr: "Un chiffre de destinations a été retiré des textes publics dans les sept langues, car aucune page de destination publiée ne l'étayait. Les nombres publics n'utilisent désormais que des comptages vérifiés par le build, et une barrière de retenue des affirmations fait échouer le build si une affirmation retirée réapparaît."
      es: "Se eliminó una cifra de destinos de los textos públicos en los siete idiomas porque ninguna página de destino publicada la respaldaba. Los números públicos ahora usan solo recuentos verificados por el build, y una barrera de contención de afirmaciones hace fallar el build si reaparece una afirmación retirada."
      de: "Eine Reiseziel-Zahl wurde in allen sieben Sprachen aus den öffentlichen Texten entfernt, da keine veröffentlichten Zielseiten sie belegten. Öffentliche Zahlen verwenden nur noch build-verifizierte Werte, und ein Claims-Restraint-Gate lässt den Build fehlschlagen, falls eine zurückgezogene Angabe wieder auftaucht."
      zh: "由于没有已发布的目的地页面作为依据，公开文案中的目的地数量已在七种语言中全部移除。公开数字现在仅使用经构建验证的计数，若已撤回的表述再次出现，声明约束关卡将使构建失败。"
      ja: "公開済みの目的地ページによる裏付けがなかったため、7言語すべての公開文面から目的地数の数値を削除した。公開される数値はビルドで検証された数のみを使用し、撤回済みの表記が再出現した場合はクレーム抑制ゲートがビルドを失敗させる。"

  - id: "2026-07-03-governance-layer"
    date: "2026-07-03"
    decision_ref: "D-003"
    title:
      en: "Public governance layer established"
      ar: "تأسيس طبقة الحوكمة العلنية"
      fr: "Mise en place de la couche de gouvernance publique"
      es: "Establecimiento de la capa pública de gobernanza"
      de: "Öffentliche Governance-Ebene eingerichtet"
      zh: "建立公开治理层"
      ja: "公開ガバナンス層を確立"
    summary:
      en: "Standing rules (GOVERNANCE.md) and an append-only decision log (DECISIONS.md) were added to the repository. Substantive changes to the ontology, standard, public claims, routes, or monetization now require a logged decision."
      ar: "أُضيفت القواعد الدائمة (GOVERNANCE.md) وسجل قرارات لا يقبل إلا الإضافة (DECISIONS.md) إلى المستودع. التغييرات الجوهرية في الأنطولوجيا أو المعيار أو الادعاءات العامة أو المسارات أو التسييل تتطلب الآن قرارًا مسجلًا."
      fr: "Des règles permanentes (GOVERNANCE.md) et un journal de décisions en ajout seul (DECISIONS.md) ont été ajoutés au dépôt. Les changements substantiels de l'ontologie, du standard, des affirmations publiques, des routes ou de la monétisation exigent désormais une décision consignée."
      es: "Se añadieron al repositorio reglas permanentes (GOVERNANCE.md) y un registro de decisiones de solo adición (DECISIONS.md). Los cambios sustanciales en la ontología, el estándar, las afirmaciones públicas, las rutas o la monetización requieren ahora una decisión registrada."
      de: "Ständige Regeln (GOVERNANCE.md) und ein Append-only-Entscheidungsprotokoll (DECISIONS.md) wurden dem Repository hinzugefügt. Wesentliche Änderungen an Ontologie, Standard, öffentlichen Aussagen, Routen oder Monetarisierung erfordern nun eine protokollierte Entscheidung."
      zh: "仓库中新增了常设规则（GOVERNANCE.md）和只增不改的决策日志（DECISIONS.md）。对本体、标准、公开表述、路由或变现机制的实质性更改现在都需要记录在案的决策。"
      ja: "常設ルール（GOVERNANCE.md）と追記専用の意思決定ログ（DECISIONS.md）をリポジトリに追加した。オントロジー、基準、公開表記、ルート、収益化に関する実質的な変更には、記録された決定が必要となった。"

  - id: "2026-07-03-category-infrastructure"
    date: "2026-07-03"
    decision_ref: "D-004"
    title:
      en: "TSO v1, TDIS v1, and the machine layer published"
      ar: "نشر TSO v1 وTDIS v1 وطبقة الآلة"
      fr: "Publication de TSO v1, TDIS v1 et de la couche machine"
      es: "Publicación de TSO v1, TDIS v1 y la capa máquina"
      de: "TSO v1, TDIS v1 und die Maschinenebene veröffentlicht"
      zh: "发布 TSO v1、TDIS v1 与机器层"
      ja: "TSO v1、TDIS v1、マシンレイヤーを公開"
    summary:
      en: "The Travel Structure Ontology (TSO) v1 and the Travel Decision Integrity Standard (TDIS) v1, including the Structure Fit Protocol, received canonical public pages in seven languages. Versioned machine-readable endpoints were published so AI agents can read the same definitions humans read."
      ar: "حصلت أنطولوجيا بنى السفر (TSO) الإصدار الأول ومعيار سلامة قرار السفر (TDIS) الإصدار الأول، بما فيه بروتوكول ملاءمة البنية، على صفحات علنية قانونية بسبع لغات. ونُشرت نقاط وصول مقروءة آليًا ومُصدَّرة حتى يقرأ وكلاء AI التعريفات نفسها التي يقرؤها البشر."
      fr: "La Travel Structure Ontology (TSO) v1 et le Travel Decision Integrity Standard (TDIS) v1, incluant le Structure Fit Protocol, ont reçu des pages publiques canoniques en sept langues. Des points d'accès versionnés lisibles par machine ont été publiés afin que les agents IA lisent les mêmes définitions que les humains."
      es: "La Travel Structure Ontology (TSO) v1 y el Travel Decision Integrity Standard (TDIS) v1, incluido el Structure Fit Protocol, recibieron páginas públicas canónicas en siete idiomas. Se publicaron puntos de acceso versionados legibles por máquina para que los agentes de IA lean las mismas definiciones que leen las personas."
      de: "Die Travel Structure Ontology (TSO) v1 und der Travel Decision Integrity Standard (TDIS) v1, einschließlich des Structure Fit Protocol, erhielten kanonische öffentliche Seiten in sieben Sprachen. Versionierte maschinenlesbare Endpunkte wurden veröffentlicht, damit KI-Agenten dieselben Definitionen lesen wie Menschen."
      zh: "旅行结构本体（TSO）v1 与旅行决策完整性标准（TDIS）v1（含结构适配协议）以七种语言获得了规范的公开页面。同时发布了带版本的机器可读端点，使 AI 代理能够读取与人类相同的定义。"
      ja: "旅行構造オントロジー（TSO）v1 と旅行意思決定インテグリティ基準（TDIS）v1（構造適合プロトコルを含む）が、7言語の正規公開ページを得た。AIエージェントが人間と同じ定義を読めるよう、バージョン管理された機械可読エンドポイントも公開された。"
