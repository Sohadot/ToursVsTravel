  - id: "egypt"
    order: 9
    enabled: true
    country_code: "EG"
    name: {en: "Egypt", ar: "مصر", fr: "Égypte", es: "Egipto", de: "Ägypten", zh: "埃及", ja: "エジプト"}
    region: {en: "North Africa", ar: "شمال أفريقيا", fr: "Afrique du Nord", es: "África del Norte", de: "Nordafrika", zh: "北非", ja: "北アフリカ"}
    summary:
      en: "Egypt's monument geography and logistics strongly favor structured, supported formats: guided circuits and Nile cruises absorb transfers, timing, and site access. Fully independent structures are possible but carry the highest coordination burden in this batch."
      ar: "جغرافيا الآثار واللوجستيات في مصر ترجحان بقوة الصيغ المنظمة المدعومة: المسارات الموجهة والرحلات النيلية تمتص التنقلات والتوقيت والوصول إلى المواقع. البنى المستقلة كليًا ممكنة لكنها تحمل أعلى عبء تنسيق في هذه الدفعة."
      fr: "La géographie monumentale et la logistique de l'Égypte favorisent fortement les formats structurés et accompagnés : circuits guidés et croisières sur le Nil absorbent transferts, timing et accès aux sites. Les structures pleinement indépendantes sont possibles mais portent la charge de coordination la plus élevée de ce lot."
      es: "La geografía monumental y la logística de Egipto favorecen con fuerza los formatos estructurados y asistidos: los circuitos guiados y los cruceros por el Nilo absorben traslados, tiempos y acceso a los sitios. Las estructuras plenamente independientes son posibles pero cargan el mayor peso de coordinación de este lote."
      de: "Ägyptens Monument-Geografie und Logistik begünstigen stark strukturierte, begleitete Formate: geführte Rundreisen und Nilkreuzfahrten fangen Transfers, Timing und Zugang zu den Stätten ab. Völlig unabhängige Strukturen sind möglich, tragen aber die höchste Koordinationslast dieser Charge."
      zh: "埃及的古迹地理与后勤强烈偏向结构化、支持型形式：向导线路与尼罗河游轮吸收了接驳、时间安排与景点准入。完全自主的结构是可行的，但在本批次中承担最高的协调负担。"
      ja: "エジプトの遺跡の地理と手配事情は、構造化・支援型形式を強く優遇する。ガイド周遊とナイル川クルーズが送迎、時間管理、遺跡へのアクセスを吸収する。完全な個人型構造も可能だが、このバッチで最も高い調整負担を伴う。"
    family_fit:
      structured_supported: "high"
      independent_autonomous: "medium"
      comfort_premium: "medium"
