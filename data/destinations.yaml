  - id: "portugal"
    order: 10
    enabled: true
    country_code: "PT"
    name: {en: "Portugal", ar: "البرتغال", fr: "Portugal", es: "Portugal", de: "Portugal", zh: "葡萄牙", ja: "ポルトガル"}
    region: {en: "Southern Europe", ar: "جنوب أوروبا", fr: "Europe du Sud", es: "Europa del Sur", de: "Südeuropa", zh: "南欧", ja: "南ヨーロッパ"}
    summary:
      en: "Portugal offers short distances, gentle logistics, and a full pilgrimage axis in the Caminho Português, making it forgiving for nearly every structure. Compact geography favors road-trip and slow formats without demanding heavy planning capacity."
      ar: "تقدم البرتغال مسافات قصيرة ولوجستيات سهلة ومحور حج كاملًا عبر الطريق البرتغالي، ما يجعلها متسامحة مع كل البنى تقريبًا. الجغرافيا المدمجة تحابي صيغ رحلات الطريق والبطء دون طلب قدرة تخطيط ثقيلة."
      fr: "Le Portugal offre de courtes distances, une logistique douce et un axe de pèlerinage complet avec le Caminho Português, ce qui le rend indulgent pour presque toutes les structures. Sa géographie compacte favorise les formats road-trip et lents sans exiger de lourde capacité de planification."
      es: "Portugal ofrece distancias cortas, logística amable y un eje de peregrinación completo en el Caminho Português, lo que lo hace indulgente con casi todas las estructuras. Su geografía compacta favorece los formatos de road trip y lentos sin exigir gran capacidad de planificación."
      de: "Portugal bietet kurze Distanzen, sanfte Logistik und mit dem Caminho Português eine vollständige Pilgerachse — nachsichtig gegenüber fast jeder Struktur. Die kompakte Geografie begünstigt Roadtrip- und langsame Formate, ohne schwere Planungskapazität zu verlangen."
      zh: "葡萄牙提供短距离、轻松的后勤，以及葡萄牙之路这条完整的朝圣轴线，使它对几乎所有结构都很宽容。紧凑的地理更适合公路旅行与慢节奏形式，而无需沉重的规划能力。"
      ja: "ポルトガルは短い移動距離、穏やかな手配事情、そしてポルトガルの道という完全な巡礼軸を備え、ほぼすべての構造に寛容である。コンパクトな地理は、重い計画能力を要求することなく、ロードトリップ型やスローな形式を優遇する。"
