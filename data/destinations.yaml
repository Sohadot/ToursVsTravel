  - id: "thailand"
    order: 8
    enabled: true
    country_code: "TH"
    name: {en: "Thailand", ar: "تايلاند", fr: "Thaïlande", es: "Tailandia", de: "Thailand", zh: "泰国", ja: "タイ"}
    region: {en: "Southeast Asia", ar: "جنوب شرق آسيا", fr: "Asie du Sud-Est", es: "Sudeste Asiático", de: "Südostasien", zh: "东南亚", ja: "東南アジア"}
    summary:
      en: "Thailand carries one of the world's deepest backpacking infrastructures alongside mature resort comfort and guided circuits. Low daily costs and dense traveler services lower the entry barrier for independent and budget structures more than almost anywhere."
      ar: "تحمل تايلاند واحدة من أعمق بنى السفر بحقيبة الظهر في العالم إلى جانب رفاهية منتجعات ناضجة ومسارات موجهة. التكاليف اليومية المنخفضة وكثافة خدمات المسافرين تخفضان حاجز الدخول للبنى المستقلة والاقتصادية أكثر من أي مكان تقريبًا."
      fr: "La Thaïlande porte l'une des infrastructures de backpacking les plus profondes au monde, aux côtés d'un confort de resorts mature et de circuits guidés. Les coûts quotidiens bas et la densité des services aux voyageurs abaissent la barrière d'entrée des structures indépendantes et économiques plus que presque partout ailleurs."
      es: "Tailandia sostiene una de las infraestructuras de mochilero más profundas del mundo junto a un confort de resorts maduro y circuitos guiados. Los bajos costes diarios y la densidad de servicios al viajero reducen la barrera de entrada de las estructuras independientes y económicas más que casi en ningún otro lugar."
      de: "Thailand trägt eine der tiefsten Backpacking-Infrastrukturen der Welt neben ausgereiftem Resort-Komfort und geführten Rundreisen. Niedrige Tageskosten und dichte Reisedienste senken die Einstiegshürde für unabhängige und Budget-Strukturen stärker als fast überall sonst."
      zh: "泰国拥有世界上最深厚的背包旅行基础设施之一，同时具备成熟的度假村舒适度与向导线路。低廉的日常成本与密集的旅行者服务，比几乎任何地方都更能降低自主与预算型结构的进入门槛。"
      ja: "タイは、世界で最も厚みのあるバックパッキングインフラの一つを、成熟したリゾートの快適さやガイド周遊と併せ持つ。低い日次コストと密度の高い旅行者向けサービスが、個人型・低予算型構造の参入障壁を世界でも稀なほど下げている。"
    family_fit:
      structured_supported: "high"
