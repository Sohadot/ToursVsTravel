{% extends "layouts/base.html" %}

{% block content %}
<div class="page-contact-root container" dir="{{ page_dir }}">
  <header class="page-hero page-hero--compact">
    <p class="page-hero__eyebrow">{{ site_name }}</p>
    <h1>{{ copy.title }}</h1>
    <p class="page-hero__lead">{{ copy.lead }}</p>
  </header>

  <section class="contact-next" aria-labelledby="contact-next-title">
    <h2 id="contact-next-title">{{ copy.note_label }}</h2>
    <ul class="contact-next__list">
      <li><a href="{{ url_methodology }}">{{ copy.ln_methodology }}</a></li>
      <li><a href="{{ url_report }}">{{ copy.ln_report }}</a></li>
      <li><a href="{{ url_compare }}">{{ copy.ln_compare }}</a></li>
      <li><a href="{{ url_tools }}">{{ copy.ln_tools }}</a></li>
      <li><a href="{{ url_destinations }}">{{ copy.ln_destinations }}</a></li>
    </ul>
  </section>
</div>
{% endblock %}
