{% extends "layouts/base.html" %}

{% block content %}
<div class="page-source-policy-root container" dir="{{ page_dir }}">
  <header class="page-hero page-hero--compact">
    <p class="page-hero__eyebrow">{{ site_name }}</p>
    <h1>{{ copy.title }}</h1>
    <p class="page-hero__lead">{{ copy.lead }}</p>
  </header>

  <section class="source-policy-section" aria-labelledby="source-policy-standards-title">
    <h2 id="source-policy-standards-title">{{ copy.standards_label }}</h2>
    <p>{{ copy.standards_body }}</p>
  </section>

  <section class="source-policy-section" aria-labelledby="source-policy-types-title">
    <h2 id="source-policy-types-title">{{ copy.types_label }}</h2>
    <p>{{ copy.types_body }}</p>
  </section>

  <nav class="methodology-nav" aria-label="{{ copy.see_also_label }}">
    <ul>
      <li><a href="{{ url_methodology }}">{{ copy.ln_methodology }}</a></li>
      <li><a href="{{ url_editorial_standards }}">{{ copy.ln_editorial_standards }}</a></li>
    </ul>
  </nav>
</div>
{% endblock %}
